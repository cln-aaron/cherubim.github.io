<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Console — Cherubim</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0C0E" />
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/styles.css" />
<link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <a class="rail-brand" href="../index.html">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 13c-4.2-3.4-9.4-4.8-15-4 1.9 2.6 2.7 4.7 2.7 7.6m12.3-.6c-5.4-2.3-10.1-2.1-14.2.6 2 2.1 2.9 4.2 3 7.1m11.2-1.3c-4.4-.4-8.1.7-11.1 3.3 1.3 1.8 2 3.8 2.1 6.2"/>
          <path d="M25 13c4.2-3.4 9.4-4.8 15-4-1.9 2.6-2.7 4.7-2.7 7.6m-12.3-.6c5.4-2.3 10.1-2.1 14.2.6-2 2.1-2.9 4.2-3 7.1m-11.2-1.3c4.4-.4 8.1.7 11.1 3.3-1.3 1.8-2 3.8-2.1 6.2"/>
          <path d="M24 9.5c2.8 2.2 6 3.3 9.6 3.5.2 9.4-3.6 17.4-9.6 22.2-6-4.8-9.8-12.8-9.6-22.2 3.6-.2 6.8-1.3 9.6-3.5z"/>
        </g>
        <path d="M24 16.5l1.7 4.8 4.8 1.7-4.8 1.7L24 29.5l-1.7-4.8-4.8-1.7 4.8-1.7z" fill="currentColor"/>
      </svg>
      <span>Cherubim</span>
    </a>

    <div class="rail-sec">Operate</div>
    <button class="rail-item on" data-nav="scan">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      New scan
    </button>
    <button class="rail-item" data-nav="scans">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      Scans <span class="ct" id="navScanCt"></span>
    </button>
    <button class="rail-item" data-nav="scheduled">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Scheduled <span class="ct" id="navSchedCt"></span>
    </button>

    <div class="rail-foot">
      <div class="rail-avatar" id="uAv">AA</div>
      <div class="rail-user"><b id="uName">Aaron Ang</b><span id="uMail">operator</span></div>
      <button class="rail-signout" id="logout" title="Sign out" aria-label="Sign out">⏻</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1>Live pentest</h1>
      <span class="crumb" id="crumb"></span>
      <div class="spacer"></div>
      <span class="pill"><span class="g"></span> Engine online</span>
    </header>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div id="drawerBody"></div></aside>
<div class="toasts" id="toasts"></div>

<script src="../assets/js/portal.js"></script>
</body>
</html>
